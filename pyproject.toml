[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# Мягкий набор правил: только настоящие ошибки (синтаксис, неиспользуемые и
# неопределённые имена, неудачные импорты). Стиль подтянем отдельным пакетом.
select = ["E4", "E7", "E9", "F"]
# E701 («if x: return» в одну строку) — 41 место в core/, чисто стилистическое.
# Уберём, когда дойдём до рефакторинга (пакет 4), а не засорять им каждый запуск.
ignore = ["E701"]
